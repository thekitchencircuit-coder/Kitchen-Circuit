<script>
/* ===== Event format: everything below is generated from CFG, which the scorekeeper can edit ===== */
var DEFCFG={
  start:960,courts:[1,3,4,5,6,7,9,10,12,13],close:1200,ovc:[3,4],ovclose:1260,erc:[],erclose:1080,
  rrSlot:20,poSlot:25,goldSlot:20,
  divs:[{name:"MD Open",pools:2,size:5,adv:3},{name:"MD DUPR 9",pools:2,size:5,adv:3},{name:"WD DUPR 9",pools:2,size:5,adv:3}],
  bronze:true,goldBo:3,
  rules:{rr:"1 game to 11, win by 2, cap 13",qf:"1 game to 15, win by 2, cap 17",sf:"1 game to 15, win by 2, cap 17",br:"1 game to 15, win by 2, cap 17",gold:"Best of 3, games to 11, win by 2, cap 15",
    notes:"No timeouts during round robin.\nPlayoffs: 1 timeout per team per game.\nGames to 15: switch sides at 8.\nGold: switch sides between games. In Game 3, switch sides at 6."}
};
var CFG=JSON.parse(JSON.stringify(DEFCFG));
var POOLS,PDIV,M,T,PO,COURTS,CEND,DIVN,PLAN={};
function rrRounds(n){
  var t=[];for(var i=1;i<=n;i++)t.push(i);if(n%2)t.push(0);
  var k=t.length,R=[];
  for(var r=0;r<k-1;r++){var ps=[];for(var i=0;i<k/2;i++){var a=t[i],b=t[k-1-i];if(a&&b)ps.push(r%2?[b,a]:[a,b]);}R.push(ps);t.splice(1,0,t.pop());}
  return R;
}
function brk(n,bronze,bo){
  var N=[],semis=null,fa,fb;
  function Sd(k){return {seed:k};} function Wn(k){return {win:k};} function Ln(k){return {lose:k};}
  if(n===8){N.push({k:"q1",t:"qf",a:Sd(1),b:Sd(8)},{k:"q2",t:"qf",a:Sd(4),b:Sd(5)},{k:"q3",t:"qf",a:Sd(2),b:Sd(7)},{k:"q4",t:"qf",a:Sd(3),b:Sd(6)});semis=[[Wn("q1"),Wn("q2")],[Wn("q3"),Wn("q4")]];}
  else if(n===6){N.push({k:"q1",t:"qf",a:Sd(3),b:Sd(6)},{k:"q2",t:"qf",a:Sd(4),b:Sd(5)});semis=[[Sd(1),Wn("q2")],[Sd(2),Wn("q1")]];}
  else if(n===4){semis=[[Sd(1),Sd(4)],[Sd(2),Sd(3)]];}
  if(semis){N.push({k:"s1",t:"sf",a:semis[0][0],b:semis[0][1]},{k:"s2",t:"sf",a:semis[1][0],b:semis[1][1]});fa=Wn("s1");fb=Wn("s2");if(bronze)N.push({k:"b",t:"br",a:Ln("s1"),b:Ln("s2")});}
  else{fa=Sd(1);fb=Sd(2);}
  for(var g=1;g<=bo;g++)N.push({k:"g"+g,t:"gold",a:fa,b:fb,g:g});
  N.forEach(function(x){x.deps=[x.a,x.b].filter(function(s){return s.win||s.lose;}).map(function(s){return s.win||s.lose;});if(x.g>1)x.deps.push("g"+(x.g-1));});
  return N;
}
function poName(p,short){
  var n=p.k.slice(1);
  if(p.t==="qf")return short?"QF"+n:"Quarterfinal "+n;
  if(p.t==="sf")return short?"SF"+n:"Semifinal "+n;
  if(p.t==="br")return "Bronze";
  return CFG.goldBo>1?(short?"Gold G"+p.g:"Gold Game "+p.g):"Gold";
}
function phName(s){if(s.seed)return "Seed "+s.seed;var k=s.win||s.lose,n=k.slice(1),nm2=k.charAt(0)==="q"?"QF"+n:"SF"+n;return (s.win?"Winner ":"Loser ")+nm2;}
function build(){
  var L="ABCDEFGHIJKLMNOPQRSTUVWXYZ",pi=0,games=[];
  POOLS={};PDIV={};M=[];PO=[];DIVN=CFG.divs.map(function(d){return d.name;});
  COURTS=CFG.courts.concat((CFG.erc||[]).filter(function(c){return CFG.courts.indexOf(c)<0;}));CEND={};COURTS.forEach(function(c){CEND[c]=(CFG.erc||[]).indexOf(c)>=0?CFG.erclose:CFG.ovc.indexOf(c)>=0?CFG.ovclose:CFG.close;});
  CFG.divs.forEach(function(d,di){
    d.pl=[];
    for(var p=0;p<d.pools;p++){
      var P=L.charAt(pi++);d.pl.push(P);PDIV[P]=di;POOLS[P]=[];
      for(var i=1;i<=d.size;i++)POOLS[P].push(P+i);
      rrRounds(d.size).forEach(function(ps,r){ps.forEach(function(x,j){games.push({id:P+"r"+r+"g"+j,kind:"rr",div:d.name,di:di,pool:P,r:r,a:P+x[0],b:P+x[1]});});});
    }
    d.n=d.pools*d.adv;
    brk(d.n,CFG.bronze,CFG.goldBo).forEach(function(x){PO.push({id:"P"+di+x.k,k:x.k,t:x.t,g:x.g,kind:x.t,di:di,div:d.name,src:[x.a,x.b],deps:x.deps.map(function(k){return "P"+di+k;})});});
  });
  /* lay the games out on courts, slot by slot */
  var len={rr:CFG.rrSlot,qf:CFG.poSlot,sf:CFG.poSlot,br:CFG.poSlot,gold:CFG.goldSlot};
  var todo=games.concat(PO),placed={},t=CFG.start,s=0,guard=0,lastEnd=t,rrEnd=t;T=[];
  while(todo.length&&guard++<400){
    var rrLeft={};todo.forEach(function(g){if(g.kind==="rr")rrLeft[g.di]=(rrLeft[g.di]||0)+1;});
    var free=COURTS.slice().sort(function(x,y){return CEND[x]-CEND[y]||x-y;}),used={},picks=[],NP=Object.keys(POOLS).length||1;
    var order=todo.slice().sort(function(x,y){
      var kx=x.kind==="rr"?0:1,ky=y.kind==="rr"?0:1;if(kx!==ky)return kx-ky;
      if(kx===1)return PO.indexOf(x)-PO.indexOf(y);
      return x.r-y.r||((L.indexOf(x.pool)+NP-(s%NP))%NP)-((L.indexOf(y.pool)+NP-(s%NP))%NP)||(x.id<y.id?-1:1);
    });
    order.forEach(function(g){
      if(g.kind==="rr"){
        if(used[g.a]||used[g.b])return;
        if(todo.some(function(o){return o.kind==="rr"&&o.pool===g.pool&&o.r<g.r;}))return;
      }else{
        if(rrLeft[g.di])return;
        if(g.deps.some(function(dp){return !(dp in placed);}))return;
      }
      var L2=len[g.kind],ci=-1;
      if(g.kind==="gold"&&g.g>1){var pv=PO.filter(function(x){return x.id==="P"+g.di+"g"+(g.g-1);})[0];if(pv){var pi2=free.indexOf(pv.court);if(pi2>=0&&CEND[pv.court]-t>=L2)ci=pi2;}}
      if(ci<0)for(var i=0;i<free.length;i++){if(CEND[free[i]]-t>=L2){ci=i;break;}}
      if(ci<0)return;
      g.court=free.splice(ci,1)[0];g.slot=s;picks.push(g);
      if(g.kind==="rr"){used[g.a]=used[g.b]=1;}
    });
    if(!picks.length){if(COURTS.every(function(c){return CEND[c]-t<CFG.rrSlot;}))break;t+=5;continue;}
    var sl=0;picks.forEach(function(g){placed[g.id]=s;sl=Math.max(sl,len[g.kind]);todo.splice(todo.indexOf(g),1);if(g.kind==="rr")M.push(g);});
    T.push(hhmm(t));lastEnd=t+sl;if(picks.some(function(g){return g.kind==="rr";}))rrEnd=t+sl;
    t+=sl;s++;
  }
  M.sort(function(x,y){return x.slot-y.slot||x.court-y.court;});
  PLAN={rrEnd:rrEnd,lastEnd:lastEnd,unplaced:todo.length,fits:!todo.length&&lastEnd<=Math.max.apply(null,COURTS.map(function(c){return CEND[c];}))};
}
function CLS(di){return ["o","d","w","x"][di%4];}


var S={s:{},n:{},c:{}},F={div:"",court:""},tab=lsGet("kc_tab")||"scores",armed=false,db=null,canEdit=!(window.claude&&window.claude.use),pn=0,ld={},dn=0,ds=0,dc=0,MY=lsGet("kc_my")||"",ST="Offline mode: saved in this browser only.",q={};
try{var raw=localStorage.getItem("pbscore1");if(raw)S=JSON.parse(raw);}catch(e){}
S.s=S.s||{};S.n=S.n||{};S.c=S.c||{};S.p=S.p||{};S.mv=S.mv||{};S.st=S.st||{};S.en=S.en||{};S.cp=S.cp||{};S.pl=S.pl||{};S.lv=S.lv||{};var TX=null,dp=0,dmv=0;
function setCfg(v){CFG=JSON.parse(JSON.stringify(DEFCFG));if(v){Object.keys(v).forEach(function(k){if(k==="rules")Object.assign(CFG.rules,v.rules);else CFG[k]=v[k];});}build();}
setCfg(S.f||null);

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
var DEF={};
function nm(c){return c?(S.n[c]||(!S.nb&&DEF[c])||c):"TBD";}
function sc(id){var v=S.s[id];if(!v||v[0]===""||v[1]===""||v[0]==null||v[1]==null)return null;var a=+v[0],b=+v[1];return a===b?null:[a,b];}

function cmp(a,b){return b.w-a.w||(b.pf-b.pa)-(a.pf-a.pa)||b.pf-a.pf||(a.t<b.t?-1:1);}
function stand(pool){
  var r={};POOLS[pool].forEach(function(t){r[t]={t:t,w:0,l:0,pf:0,pa:0};});
  M.forEach(function(m){
    if(m.pool!==pool)return;var x=sc(m.id);if(!x)return;
    var a=r[m.a],b=r[m.b];a.pf+=x[0];a.pa+=x[1];b.pf+=x[1];b.pa+=x[0];
    if(x[0]>x[1]){a.w++;b.l++;}else{b.w++;a.l++;}
  });
  return h2hSort(Object.keys(r).map(function(k){return r[k];}).sort(cmp),pool);
}
/* teams level on wins: head-to-head first (results between the tied teams), then point differential, then points scored */
function h2hSort(l,pool){
  var out=[],i=0;
  while(i<l.length){var j=i;while(j<l.length&&l[j].w===l[i].w)j++;var g=l.slice(i,j);
    if(g.length>1){var ids={},mw={};g.forEach(function(x){ids[x.t]=1;mw[x.t]=0;});
      M.forEach(function(m){if(m.pool!==pool||!ids[m.a]||!ids[m.b])return;var x=sc(m.id);if(!x)return;mw[x[0]>x[1]?m.a:m.b]++;});
      g.sort(function(a,b){return mw[b.t]-mw[a.t]||cmp(a,b);});}
    out=out.concat(g);i=j;}
  return out;
}
function seeds(di){
  var d=CFG.divs[di],l=[];d.pl.forEach(function(p){l=l.concat(stand(p).slice(0,d.adv));});
  return l.sort(cmp).map(function(x){return x.t;});
}
function done(di){return M.filter(function(m){return m.di===di;}).every(function(m){return sc(m.id);});}

function inp(id,i,v,en){return '<input type="number" inputmode="numeric" min="0" data-id="'+id+'" data-i="'+i+'" value="'+(v==null?"":v)+'"'+(en?"":" disabled")+'>';}
var SDM=null;
function who(t,ph){
  if(!t)return ph?'<small>'+esc(ph)+'</small>TBD':'TBD';
  var s=SDM&&SDM[t];
  return (s?'<small>Seed '+s+'</small> ':'')+esc(nm(t));
}
var NXC=null;FRC=null;
function nextMap(){
  if(NXC)return NXC;NXC={};
  allGames().forEach(function(g){if(sc(g.id)||!g.a||!g.b)return;if(!NXC[g.a])NXC[g.a]=g.id;if(!NXC[g.b])NXC[g.b]=g.id;});

}
/* the match that owns each court right now: the one in progress, otherwise the earliest unplayed one */
var FRC=null;
function courtFront(){
  if(FRC)return FRC;FRC={f:{},c:{}};var G=allGames();

  G.filter(function(g){return !sc(g.id);}).sort(function(x,y){return x.slot-y.slot;}).forEach(function(g){if(!FRC.f[g.court])FRC.f[g.court]=g.id;});

}
function courtOK(id){var F=courtFront();return F.c[id]!=null&&F.f[F.c[id]]===id;}
function row(id,lb,a,b,en,cls,pa,pb){

  var allIn=Object.keys(POOLS).every(function(p){return POOLS[p].every(function(x){return S.c[x];});});
  var ca=!!(a&&S.c[a]),cb=!!(b&&S.c[b]),nx=nextMap(),cok=a&&b&&!sc(id)?courtOK(id):false,rdy=ca&&cb&&!sc(id)&&nx[a]===id&&nx[b]===id&&cok;

  return '<div class="mw'+(ip?' live':'')+'"><div class="m '+(cls||"")+(canEdit?' e':'')+(rdy?' rdy':'')+(ip?' ipm':'')+'"><div class="lb">'+lb+(ip?'<span class="ipb">Live</span>':rdy?'<span class="rb">Ready</span>':'')+'</div><div class="tm r'+(ca?' ci':'')+'">'+(ca&&!allIn?'<i class="okc" title="Checked in">&#10003;</i> ':'')+who(a,pa)+'</div>'+inp(id,0,v[0],ok)+'<span>-</span>'+inp(id,1,v[1],ok)+'<div class="tm'+(cb?' ci':'')+'">'+(cb&&!allIn?'<i class="okc" title="Checked in">&#10003;</i> ':'')+who(b,pb)+'</div>'+
    (canEdit?'<button class="cl" data-clr="'+id+'" title="Clear this score" aria-label="Clear this score"'+(has?'':' disabled')+'>&times;</button>':'')+'</div>'+ctl+liveLine(id,a)+'</div>';

function nowMin(){var d=new Date();return d.getHours()*60+d.getMinutes();}
function hhmm(m){var h=Math.floor(m/60),mm=m%60;return (h>12?h-12:h)+":"+(mm<10?"0":"")+mm+(h>=12?" PM":" AM");}
function prevOn(G,g){return G.filter(function(x){return x.court===g.court&&x.slot<g.slot;}).sort(function(x,y){return y.slot-x.slot;})[0];}

function freeCourts(G){
  return COURTS.filter(function(c){
    var on=G.filter(function(x){return x.court===c;});
    return on.length&&on.every(function(x){return sc(x.id);})&&nowMin()<=CEND[c]-30;
  });
}
function movable(G){
  return G.filter(function(g){
    if(sc(g.id)||!g.a||!g.b||S.mv[g.id]||S.st[g.id])return false;
    var pv=prevOn(G,g);
    return pv&&!sc(pv.id)&&teamsFree(G,g);
  });
}
function freePanel(){
  var G=allGames(),fc=freeCourts(G),mv=movable(G),h='';
  var moved=G.filter(function(g){return S.mv[g.id];});

  if(fc.length){
    h+='<p class="sub">These courts have finished all their scheduled matches and have at least 30 minutes left. Send a waiting match there to keep things moving.</p>';
    fc.forEach(function(c){
      h+='<div class="fc"><div><b>Court '+c+'</b> is free <span class="sub">(closes '+hhmm(CEND[c])+')</span></div>';
      if(!mv.length)h+='<div class="sub" style="margin:2px 0 0">No waiting match has both teams free right now.</div>';
      else h+='<div class="txb"><select data-pick="'+c+'" aria-label="Match to send to Court '+c+'">'+mv.map(function(g,i){return '<option value="'+g.id+'">'+esc(nm(g.a))+' v '+esc(nm(g.b))+' (planned '+T[g.slot]+', Ct '+g.court+')</option>';}).join('')+'</select><button class="cp" data-go="'+c+'">Send to Court '+c+'</button></div>';
      h+='</div>';

  });

}

  else if(!done1&&S.en[id]){S.en=Object.assign({},S.en);delete S.en[id];wen();}

    var t=g.po?(PO.filter(function(x){return x.id===id;})[0]||{}).t:"rr";rows.push({id:id,g:g,type:t,min:(en-st)/60000});});
  return rows;

function series(a,b,ids){
  var wa=0,wb=0;
  ids.forEach(function(id){var x=sc(id);if(x&&a&&b){if(x[0]>x[1])wa++;else wb++;}});
  return[wa,wb];
}
function resolve(di){
  var o=seeds(di),en=done(di),R={};
  function val(sx){if(sx.seed)return o[sx.seed-1]||null;var id="P"+di+(sx.win||sx.lose),x=sc(id),r=R[id];if(!x||!r||!r.a||!r.b)return null;var w=x[0]>x[1]?r.a:r.b;return sx.win?w:(w===r.a?r.b:r.a);}
  PO.forEach(function(p){if(p.di===di)R[p.id]={a:val(p.src[0]),b:val(p.src[1]),pa:phName(p.src[0]),pb:phName(p.src[1])};});
  return {o:o,en:en,R:R};
}
function goldNeeded(di,R,g){
  var need=Math.ceil(CFG.goldBo/2);if(g<=need)return true;
  var r=R["P"+di+"g1"]||{},ids=[];for(var k=1;k<g;k++)ids.push("P"+di+"g"+k);
  var sr=series(r.a,r.b,ids);return sr[0]<need&&sr[1]<need;
}
function bracket(di){

  h+='<div class="sdl">'+(en?'Seeds: ':'Provisional seeds: ')+o.map(function(t,i){return '<b>'+(i+1)+'</b> '+esc(nm(t));}).join(' &middot; ')+'</div>';
  PO.forEach(function(p){
    if(p.di!==di)return;var r=R[p.id];
    var ok=en&&(p.t!=="gold"||goldNeeded(di,R,p.g));
    h+=row(p.id,poName(p,true),r.a,r.b,ok,"p",r.pa,r.pb);
  });
  var g1=R["P"+di+"g1"];
  if(g1&&g1.a&&g1.b){var ids=[];for(var k=1;k<=CFG.goldBo;k++)ids.push("P"+di+"g"+k);var f=series(g1.a,g1.b,ids),need=Math.ceil(CFG.goldBo/2);
    if(f[0]>=need)h+='<div class="champ">Champion: '+who(g1.a)+'</div>';else if(f[1]>=need)h+='<div class="champ">Champion: '+who(g1.b)+'</div>';}
  SDM=null;
  return h;
}

function richTxt(t){
  var lines=String(t).split("\n"),h="",inList=false;
  function inl(x){return esc(x).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");}
  lines.forEach(function(l){var x=l.trim();
    if(/^[-*•]\s+/.test(x)){if(!inList){h+="<ul>";inList=true;}h+="<li>"+inl(x.replace(/^[-*•]\s+/,""))+"</li>";return;}
    if(inList){h+="</ul>";inList=false;}
    if(!x)return;
    if(/^#+\s+/.test(x))h+='<div class="fmh2">'+inl(x.replace(/^#+\s+/,""))+"</div>";else h+="<p>"+inl(x)+"</p>";
  });

}

function autoTxt(k){

}

function outlook(me){
  var pool=me.charAt(0),di=PDIV[pool],d=CFG.divs[di],adv=d.adv,l=stand(pool),pm=M.filter(function(m){return m.pool===pool;});
  var left={};l.forEach(function(x){left[x.t]=pm.filter(function(m){return (m.a===x.t||m.b===x.t)&&!sc(m.id);}).length;});
  var mine=l.filter(function(x){return x.t===me;})[0],rank=l.indexOf(mine)+1;
  if(done(di)){var sd=seeds(di),sn=sd.indexOf(me);
    return sn>=0?{cls:"in",t:"Through to the playoffs as Seed "+(sn+1)+(sn<2&&d.n===6?" (bye to the semifinals)":"")+"."}:{cls:"out",t:"Pool play is over. You finished "+rank+" in Pool "+pool+" and did not make the playoffs."};}
  var others=l.filter(function(x){return x.t!==me;});
  if(!pm.some(function(m){return sc(m.id);}))return {cls:"mid",t:"Pool play hasn't started. Top "+adv+" in Pool "+pool+" advance to the playoffs."};
  var canCatch=others.filter(function(x){return x.w+left[x.t]>=mine.w;}).length;
  var ahead=others.filter(function(x){return x.w>mine.w+left[me];}).length;
  if(canCatch<adv)return {cls:"in",t:"Clinched a playoff spot. Top "+adv+" in the pool advance."};
  if(ahead>=adv)return {cls:"out",t:"Out of playoff contention. "+(left[me]?"Enjoy your remaining games!":"")};
  return {cls:"mid",t:"Currently "+["1st","2nd","3rd","4th","5th","6th"][rank-1]+" in Pool "+pool+". Top "+adv+" advance."+(left[me]?" "+left[me]+" game"+(left[me]>1?"s":"")+" left"+(rank<=adv?": keep winning to hold your spot.":": wins and point difference decide it."):"")};
}
function dayList(me){
  var G=allGames(),mine=G.filter(function(g){return g.a===me||g.b===me;}),nextId=(G.filter(function(x){return (x.a===me||x.b===me)&&!sc(x.id);})[0]||{}).id;

  var items=[];
  Object.keys(rounds).sort(function(a,b){return a-b;}).forEach(function(r){
    var g=rounds[r].filter(function(m){return m.a===me||m.b===me;})[0];
    if(g)items.push(G.filter(function(x){return x.id===g.id;})[0]||g);else items.push({bye:true,r:+r});
  });

  if(SNAP.f){if(!(WT.f>SNAP.f.t)){setCfg(SNAP.f.v);DRAFT=null;}delete SNAP.f;ch=true;}
  if(SNAP.rf&&PEND===0){if(!(WT.rf>SNAP.rf.t))S.rf=SNAP.rf.v;delete SNAP.rf;ch=true;}
  ["n","c","p","mv","st","en","cp","pl","lv","wl","inf"].forEach(function(k){if(SNAP[k]){if(!(WT[k]>SNAP[k].t)){S[k]=SNAP[k].v;if(k==="n")S.nb=SNAP[k].nb;}delete SNAP[k];ch=true;}});
  if(ch)render();
}
function queueSave(key,fn,done){
  PEND++;LASTEDIT=Date.now();
  q[key]=(q[key]||Promise.resolve()).then(fn).catch(werr).then(function(){PEND--;if(done)done();LASTEDIT=Math.max(LASTEDIT,Date.now()-1500);setTimeout(tryApply,2100);});
}
setInterval(tryApply,1500);
document.addEventListener("focusout",function(){setTimeout(tryApply,50);});
function wr(id,v){
  if(!db){save();return;}
  var vv=v.slice();queueSave(id,function(){return db.collection("scores").doc(id).set({a:vv[0],b:vv[1]});},function(){SW[id]={v:vv,t:Date.now()};});
}
function wp(){
  if(!db){save();return;}
  var pv=Object.assign({},S.p);queueSave("ph",function(){return db.doc("private/phones").set({p:pv});},function(){WT.p=Date.now();});
}
function wc(){
  if(!db){save();return;}
  var cv=Object.assign({},S.c),pv=JSON.parse(JSON.stringify(S.cp));queueSave("ck",function(){return db.doc("meta/checkin").set({c:cv,p:pv});},function(){WT.c=WT.cp=Date.now();});
}
function wn(){
  if(!db){save();return;}
  var nv=Object.assign({},S.n),bv=!!S.nb,lv=JSON.parse(JSON.stringify(S.pl));queueSave("names",function(){return db.doc("meta/names").set({n:nv,blank:bv,pl:lv});},function(){WT.n=WT.pl=Date.now();});
}
document.addEventListener("change",function(e){
  var t=e.target,d=t.dataset;
  if(d.f){F[d.f]=t.value;}
  else if(d.my!==undefined){MY=t.value;lsSet("kc_my",MY||null);}
  else if(d.ph!==undefined){return;}
  else if(d.srch!==undefined||d.pn!==undefined||d.rsrch!==undefined){return;}
  else if(d.pck!==undefined){if(!canEdit)return;var pq=d.pck.split("|");setPlayer(pq[0],+pq[1],t.checked);}
  else if(d.cf!==undefined||d.dv!==undefined||d.cr!==undefined){cfgInput(t);if(t.type==="checkbox"||t.tagName==="SELECT")render();return;}
  else if(d.tx!==undefined){TX=+t.value;}
  else if(d.ck){if(!canEdit)return;S.c=Object.assign({},S.c);if(t.checked)S.c[d.ck]=true;else delete S.c[d.ck];dc=1;wc();}
  else if(d.tm){if(t.value.trim())S.n[d.tm]=t.value.trim();else delete S.n[d.tm];dn=1;wn();return;}
  else if(d.id){var v=(S.s[d.id]||["",""]).slice();v[+d.i]=t.value;S.s[d.id]=v;ds=1;wr(d.id,v);markEnd(d.id);setTimeout(refresh,0);return;}
  else return;
  render();
});
document.addEventListener("focusout",function(e){var t=e.target;if(t&&t.dataset&&t.dataset.id!==undefined)setTimeout(refresh,0);});
document.addEventListener("input",function(e){
  var t=e.target,d=t.dataset;
  if(d.cf!==undefined||d.dv!==undefined||d.cr!==undefined){cfgInput(t);return;}
  if(d.srch!==undefined){SEARCH=t.value;filterTeams();return;}
  if(d.rsrch!==undefined){RSEARCH=t.value;filterRoster();return;}
  if(d.pn!==undefined){var pp=d.pn.split("|");setPlayerName(pp[0],+pp[1],t.value);return;}
  if(d.tm!==undefined){if(t.value.trim())S.n[d.tm]=t.value.trim();else delete S.n[d.tm];dn=1;wn();}
  else if(d.ph!==undefined){S.p=Object.assign({},S.p);if(t.value.trim())S.p[d.ph]=t.value.trim();else delete S.p[d.ph];dp=1;wp();}
  else if(d.id){var v=(S.s[d.id]||["",""]).slice();v[+d.i]=t.value;S.s[d.id]=v;ds=1;wr(d.id,v);}
});
document.addEventListener("click",function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.t){var ae=document.activeElement;if(ae&&ae.blur)ae.blur();tab=t.dataset.t;lsSet("kc_tab",tab);armed=false;armedClr=false;render();window.scrollTo(0,0);}
  else if(t.dataset&&t.dataset.clr){if(!canEdit)return;var cid=t.dataset.clr;S.s[cid]=["",""];ds=1;wr(cid,["",""]);markEnd(cid);if(RF()[cid]){S.rf=Object.assign({},RF());delete S.rf[cid];if(REFSAVED===cid)REFSAVED=null;if(db)queueSave("rf"+cid,function(){return db.collection("ref").doc(cid).delete();},function(){WT.rf=Date.now();});}render();}
  else if(t.dataset&&t.dataset.cp!==undefined){copyText(t);}
  else if(t.dataset&&t.dataset.start&&canEdit){S.st=Object.assign({},S.st);S.st[t.dataset.start]=Date.now();wst();render();}
  else if(t.dataset&&t.dataset.unstart&&canEdit){S.st=Object.assign({},S.st);delete S.st[t.dataset.unstart];wst();render();}
  else if(t.dataset&&t.dataset.go&&canEdit){var c=+t.dataset.go,sel=document.querySelector('select[data-pick="'+c+'"]');if(sel&&sel.value){S.mv=Object.assign({},S.mv);S.mv[sel.value]=c;wmv();render();}}
  else if(t.dataset&&t.dataset.undo&&canEdit){S.mv=Object.assign({},S.mv);delete S.mv[t.dataset.undo];wmv();render();}
  else if(t.dataset&&t.dataset.txm){TXM=t.dataset.txm;render();}
  else if(t.dataset&&t.dataset.lv!==undefined&&canEdit){S.lv={open:t.dataset.lv==="1"};wlv();render();}
  else if(t.dataset&&t.dataset.ckall!==undefined&&canEdit){var on=t.dataset.ckall==="1",c={};if(on)Object.keys(POOLS).forEach(function(p){POOLS[p].forEach(function(x){c[x]=true;});});S.c=c;var cpx={};if(on)Object.keys(c).forEach(function(x){cpx[x]=[true,true];});S.cp=cpx;dc=1;wc();render();}
  else if(t.dataset&&t.dataset.adddv&&canEdit){if(!DRAFT)DRAFT=mkDraft();DRAFT.divs.push({name:"New division",pools:2,size:5,adv:3});render();}
  else if(t.dataset&&t.dataset.rmdv&&canEdit){if(!DRAFT)DRAFT=mkDraft();DRAFT.divs.splice(+t.dataset.rmdv,1);render();}
  else if(t.dataset&&t.dataset.savecfg&&canEdit){if(!DRAFT)DRAFT=mkDraft();if(!anyScore()&&!fmtErrors(DRAFT).length){saveCfg();ST="Format saved.";render();}else render();}
  else if(t.dataset&&t.dataset.undocfg&&canEdit){DRAFT=null;render();}
  else if(t.dataset&&t.dataset.clrall&&canEdit){if(!armedClr){armedClr=true;render();return;}armedClr=false;clearAll();}
});
function typing(){var a=document.activeElement;return !!(a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA")&&a.type!=="checkbox");}
function refresh(){if(typing())return;render();}
function initDb(){
  if(!(window.claude&&claude.use))return;
  S={s:{},n:{},c:{},p:{},mv:{},st:{},en:{},cp:{},pl:{},lv:{},rf:{},wl:{},inf:{}};setCfg(null);ST="Connecting to live scores...";
  claude.use("db").then(function(d){
    if(!d){ST="Sign in to Claude to see live scores.";render();return;}
    db=d;S={s:{},n:{},c:{},p:{},mv:{},st:{},en:{},cp:{},pl:{},lv:{},rf:{},wl:{},inf:{}};canEdit=false;ST="Connecting to live scores...";render();
    var tm=setTimeout(function(){ST="Cannot reach live scores yet. What you see may be out of date.";render();},10000);
    function ok(){clearTimeout(tm);ST=canEdit?"Scorekeeper mode. Scores save live.":isRefUser()?"Referee mode. Pick your match on the Referee tab.":"Live view. Updates automatically.";}
    db.collection("scores").onSnapshot(function(snap){ld.s=1;var x={};snap.docs.forEach(function(y){var v=y.data();if(v)x[y.id]=[v.a,v.b];});SNAP.s={v:x,t:Date.now()};ok();tryApply();},function(){ST="Live scores are unavailable right now.";render();});
    db.doc("meta/names").onSnapshot(function(y){ld.n=1;var v=y.exists?y.data():null;var tn=Date.now();SNAP.n={v:Object.assign({},(v&&v.n)||{}),nb:!!(v&&v.blank),t:tn};SNAP.pl={v:JSON.parse(JSON.stringify((v&&v.pl)||{})),t:tn};ok();tryApply();},function(){});
    db.doc("meta/checkin").onSnapshot(function(y){ld.c=1;var v=y.exists?y.data():null;var tc=Date.now();SNAP.c={v:Object.assign({},(v&&v.c)||{}),t:tc};SNAP.cp={v:JSON.parse(JSON.stringify((v&&v.p)||{})),t:tc};tryApply();},function(){});
    db.doc("meta/format").onSnapshot(function(y){var v=y.exists?y.data():null,c=null;try{c=v&&v.j?JSON.parse(v.j):null;}catch(e){}SNAP.f={v:c,t:Date.now()};tryApply();},function(){});
    db.doc("meta/info").onSnapshot(function(y){var v=y.exists?y.data():null;SNAP.inf={v:(v&&v.i)||{},t:Date.now()};tryApply();},function(){});
    db.doc("meta/waitlist").onSnapshot(function(y){var v=y.exists?y.data():null;SNAP.wl={v:(v&&v.w)||{},t:Date.now()};tryApply();},function(){});
    db.doc("meta/live").onSnapshot(function(y){var v=y.exists?y.data():null;SNAP.lv={v:{open:!!(v&&v.open)},t:Date.now()};tryApply();},function(){});
    db.doc("meta/ended").onSnapshot(function(y){var v=y.exists?y.data():null;SNAP.en={v:Object.assign({},(v&&v.e)||{}),t:Date.now()};tryApply();},function(){});
    db.doc("meta/started").onSnapshot(function(y){ld.t=1;var v=y.exists?y.data():null;SNAP.st={v:Object.assign({},(v&&v.g)||{}),t:Date.now()};tryApply();},function(){});
    db.doc("meta/moves").onSnapshot(function(y){ld.m=1;var v=y.exists?y.data():null;SNAP.mv={v:Object.assign({},(v&&v.m)||{}),t:Date.now()};tryApply();},function(){});
    db.collection("ref").onSnapshot(function(snap){var x={};snap.docs.forEach(function(y){var v=y.data();if(v)x[y.id]=v;});SNAP.rf={v:x,t:Date.now()};tryApply();},function(){});
    db.doc("private/phones").onSnapshot(function(y){ld.p=1;var v=y.exists?y.data():null;SNAP.p={v:Object.assign({},(v&&v.p)||{}),t:Date.now()};tryApply();},function(){});
    return claude.use("user").then(function(u){
      if(!u||!u.canEdit)return false;
      return Promise.resolve(u.canEdit()).then(function(ce){if(ce===true||ce===false)return ce;return Promise.resolve(u.isOwner?u.isOwner():false).then(function(o){return o===true;});});
    }).then(function(ce){canEdit=ce===true;if(!canEdit&&tab==="scores")tab="standings";ok();render();}).catch(function(){canEdit=false;ok();render();});
  }).catch(function(){ST="Live scores are unavailable right now.";render();});
}
render();
initDb();
setInterval(function(){refresh();},30000);
</script>
</body>
</html>
